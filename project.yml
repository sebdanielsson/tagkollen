name: Tagkollen
options:
  bundleIdPrefix: se.tagkollen
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    # Bundle identifier prefix. The release build uses se.tagkollen.app; a developer on another Apple
    # team sets APP_BUNDLE_ID in Config/Secrets.xcconfig (via .env.local), because bundle IDs and App
    # Groups are unique across teams and cannot be registered twice.
    TAGKOLLEN_BUNDLE_ID: "$(APP_BUNDLE_ID:default=se.tagkollen.app)"
    # Bumped by release-please (see release-please-config.json); CI stamps the build number.
    MARKETING_VERSION: 0.1.1 # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  TrafikverketKit:
    path: Packages/TrafikverketKit
targets:
  Tagkollen:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Tagkollen
        excludes:
          - "**/.DS_Store"
          - "AppIcon.icon/**"
      # Icon Composer package; Xcode compiles every appearance (default, dark, clear, tinted) from it.
      - path: Tagkollen/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TrafikverketKit
      - target: TagkollenWidgets
    entitlements:
      path: Tagkollen/Tagkollen.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(TAGKOLLEN_BUNDLE_ID)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TAGKOLLEN_BUNDLE_ID)"]
    info:
      path: Tagkollen/Info.plist
      properties:
        CFBundleDisplayName: Tågkollen
        CFBundleName: Tagkollen
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sv]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Tågkollen använder din plats för att centrera kartan och visa tåg nära dig."
        NSMicrophoneUsageDescription: "Mikrofonen används för att söka efter tåg och stationer med rösten."
        NSSpeechRecognitionUsageDescription: "Taligenkänning används för att söka efter tåg och stationer med rösten."
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: ["$(TAGKOLLEN_BUNDLE_ID).refresh"]
        TagkollenAppGroup: "group.$(TAGKOLLEN_BUNDLE_ID)"
        TagkollenKeychainGroup: "$(AppIdentifierPrefix)$(TAGKOLLEN_BUNDLE_ID)"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        CFBundleURLTypes:
          - CFBundleURLName: "$(TAGKOLLEN_BUNDLE_ID)"
            CFBundleURLSchemes: [tagkollen]
        TRVAPIKey: "$(TRV_API_KEY)"
        TRVAPIKeyRegistrationURL: "https://data.trafikverket.se"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGKOLLEN_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "Tagkollen/Preview\\ Content"
  TagkollenWidgets:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: TagkollenWidgets
        excludes:
          - "**/.DS_Store"
      # Shared with the app. Each target compiles its own copy.
      - path: Tagkollen/Models
      - path: Tagkollen/Services/TrainService.swift
      - path: Tagkollen/Support/APIKeyStore.swift
      - path: Tagkollen/Support/Formatters.swift
      - path: Tagkollen/Support/Keychain.swift
      - path: Tagkollen/Support/SharedStorage.swift
      - path: Tagkollen/Support/StationNames.swift
      - path: Tagkollen/Views/Components/DelayBadge.swift
      - path: Tagkollen/Resources/Localizable.xcstrings
    dependencies:
      - package: TrafikverketKit
      # Explicit links so the App Intents metadata processor runs for the widget configuration intents.
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    entitlements:
      path: TagkollenWidgets/TagkollenWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(TAGKOLLEN_BUNDLE_ID)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TAGKOLLEN_BUNDLE_ID)"]
    info:
      path: TagkollenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tågkollen
        CFBundleName: TagkollenWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sv]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TRVAPIKey: "$(TRV_API_KEY)"
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGKOLLEN_BUNDLE_ID).widgets"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
  TagkollenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TagkollenTests]
    dependencies:
      - target: Tagkollen
      - package: TrafikverketKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGKOLLEN_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tagkollen:
    build:
      targets:
        Tagkollen: all
        TagkollenWidgets: all
        TagkollenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TagkollenTests
        - package: TrafikverketKit/TrafikverketKitTests
    archive:
      config: Release
