name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat (check only)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  kit-tests:
    name: TrafikverketKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: Packages/TrafikverketKit
        run: swift test

  app:
    name: Build and test app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          mkdir -p Config
          echo "TRV_API_KEY =" > Config/Secrets.xcconfig
          xcodegen generate
      - name: Build and test
        env:
          CI: "true"
        run: |
          set -o pipefail
          xcodebuild -project Tagkollen.xcodeproj -scheme Tagkollen \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build test
